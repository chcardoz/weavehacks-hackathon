[project]
name = "keepalive-club"
version = "0.2.2"
description = "Thin client watchdog for GPU training runs: detects failures and reports metrics/events to the keepalive dashboard, which diagnoses and opens fix PRs."
readme = "README.md"
license = "MIT"
authors = [{ name = "keepalive", email = "support@keepalive.club" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
wandb = ["wandb>=0.19"]
weave = ["weave>=0.51"]

[project.scripts]
keepalive = "keepalive.cli:app"

[project.urls]
Homepage = "https://weavehacks-hackathon-dashboard.vercel.app"
Documentation = "https://weavehacks-hackathon-dashboard.vercel.app/docs"
Source = "https://github.com/keepalive-club/keepalive"

[build-system]
requires = ["uv_build>=0.5,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution is `keepalive-club` (the bare name is squatted on PyPI by an
# unrelated urllib package) but the import stays `import keepalive`.
module-name = "keepalive"
