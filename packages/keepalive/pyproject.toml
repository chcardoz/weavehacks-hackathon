[project]
name = "keepalive"
version = "0.1.0"
description = "Watchdog for GPU training runs: detects failures, escalates to a human, and races AI-written fixes when you don't show up."
readme = "README.md"
license = "MIT"
authors = [{ name = "keepalive", email = "support@keepalive.club" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "wandb>=0.19",
    "weave>=0.51",
    "openai>=1.60",
    "redis>=5.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
cursor = ["cursor-sdk>=0.1"]
memory = ["agent-memory-client>=0.9", "redisvl>=0.3"]

[project.scripts]
keepalive = "keepalive.cli:app"

[project.urls]
Homepage = "https://keepalive.club"
Documentation = "https://docs.keepalive.club"
Source = "https://github.com/keepalive-club/keepalive"

[build-system]
requires = ["uv_build>=0.5,<0.9"]
build-backend = "uv_build"
