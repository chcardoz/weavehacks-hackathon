# Local Redis stack for keepalive.
#   docker compose -f infra/docker-compose.yml up -d
# Requires OPENAI_API_KEY in the environment (used by the memory server for embeddings).
#
# Use redis:8 (query/vector engine is in core). Do NOT use redis-stack (legacy).

services:
  redis:
    image: redis:8
    container_name: keepalive-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-memory-server:
    # Verify this image name at the event. If stale, build from
    # https://github.com/redis/agent-memory-server and set image: agent-memory-server
    image: andrewbrookins510/agent-memory-server
    container_name: keepalive-agent-memory
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Memory server connects to the redis service on the compose network.
      REDIS_URL: "redis://redis:6379/0"
      # Embeddings for long-term memory semantic search + dedup.
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    ports:
      # container 8000 -> host 8001 so it doesn't collide with the local relay on 8000.
      - "8001:8000"

volumes:
  redis-data:
