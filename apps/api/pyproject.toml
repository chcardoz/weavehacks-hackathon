[project]
name = "keepalive-api"
version = "0.1.0"
description = "keepalive hosted backend: API key auth, Twilio SMS relay, voice-note pages"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "twilio>=9.3",
    "redis>=5.0",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.18",
]

[build-system]
requires = ["uv_build>=0.5,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "keepalive_api"
