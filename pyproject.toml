[project]
name = "keepalive-monorepo"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[tool.uv.sources]
keepalive = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "fakeredis>=2.26",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.pytest.ini_options]
testpaths = ["packages/keepalive/tests", "apps/api/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["packages/**/*.py", "apps/api/**/*.py"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["SIM108", "SIM117"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["keepalive", "keepalive_api"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B", "SIM", "RUF012"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportPrivateImportUsage = false
include = ["packages/keepalive/src", "apps/api/src"]
venvPath = "."
venv = ".venv"
